spec_version: v1
kind: knowledge_base
name: Employee_Policies_knowledge_base_6638iG
description: |-
  Use this knowledge base to answer employee questions about company leave, remote work, business travel, expense reimbursements, code of conduct, general employee benefits and allowances, claim procedures, working hours, office rules, information security, and department-specific onboarding checklists.

  Use it only for informational questions grounded in approved company documents. Do not use it to submit requests, check request status, approve requests, or answer questions about salary, payroll, personal medical information, disciplinary matters, or performance records.
vector_index:
  embeddings_model_name: ibm/slate-125m-english-rtrvr-v2
  chunk_size: 400
  chunk_overlap: 50
  extraction_strategy: standard
conversational_search_tool:
  language: en
  index_config: []
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
  supports_full_document: false
prioritize_built_in_index: true
representation: tool
documents: []
